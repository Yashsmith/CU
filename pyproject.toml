[project]
name = "computer-use"
version = "2.0.0"
description = "Computer Use Agent — vision model + real Mac control via pyautogui"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "groq>=0.11",
  "pillow>=10.0",
  "mss>=9.0",
  "pyautogui>=0.9.54",
  "textual>=0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
computer-use = "agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tui"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "sandbox*"]

